name: CI

on:
  push:
    branches: [main]
  pull_request:  # any base: stacked PRs target feature branches

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy
      - name: shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17.11-bookworm", "18.6-trixie"]  # macOS dev server, homelab server
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres  # throwaway service container, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ECOMGEN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --junitxml=junit.xml
      - name: no skipped tests  # a skipped integration test means the database wasn't exercised
        run: uv run python scripts/ci_no_skips.py junit.xml
