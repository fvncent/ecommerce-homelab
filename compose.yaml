# Local/dev PostgreSQL. Bound to localhost only. Password comes from .env (never committed).
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ecommerce_oltp
      POSTGRES_USER: ecomgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomgen -d ecommerce_oltp"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
