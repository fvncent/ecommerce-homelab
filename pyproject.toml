[project]
name = "ecomgen"
version = "0.1.0"
description = "Synthetic e-commerce source-data generator (PostgreSQL + files)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
ecomgen = "ecomgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"  # always list skip reasons, so skipped DB tests are visible

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
